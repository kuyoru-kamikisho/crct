name: web_egg
description: Android Web 外壳 — 将 Web 项目包裹为原生应用
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  wakelock_plus: ^1.3.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/bridge.js
