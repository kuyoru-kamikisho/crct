# 目标应用：可用包名或应用名称（任一即可匹配）
app:
  package: "com.oddyarts.AurumBladeEXNative"
  name: "黄金之剑"

# 模拟器偏好（优先使用；为空则自动选择已安装的第一个）
emulator:
  preferred: "雷电模拟器"
  # 雷电实例索引，默认 0
  ldplayer_index: 0
  # 启动超时（秒）
  startup_timeout: 120
  # 轮询间隔（秒）
  poll_interval: 2

# 路径（相对脚本所在目录）
paths:
  cache_dir: "cache"
  screenshot_dir: "cache/screenshots"
  log_dir: "logs"

# 日志
logging:
  level: "INFO"
  filename: "promilia.log"
