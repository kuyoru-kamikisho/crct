<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>重置密码 - 功能测试</title>
</head>
<body>
  <h1>重置密码</h1>
  <p>
    <a href="login.html">登录</a> |
    <a href="forgetpwd.html">忘记密码</a>
  </p>
  <p>支持从 URL 参数 <code>?token=...</code> 自动填充重置 Token。</p>

  <form id="resetForm">
    <div>
      <label>重置 Token <input id="resetToken" type="text" required style="width: 28em" /></label>
    </div>
    <div>
      <label>新密码（6~64） <input id="newPassword" type="password" required minlength="6" maxlength="64" /></label>
    </div>
    <div>
      <label>
        图片验证码
        <input id="captchaCode" type="text" required autocomplete="off" />
      </label>
      <input id="captchaId" type="hidden" />
      <img id="captchaImg" width="120" height="40" alt="验证码" />
      <button type="button" id="refreshCaptcha">刷新验证码</button>
    </div>
    <div>
      <button type="submit">重置密码</button>
    </div>
  </form>

  <h2>响应</h2>
  <pre id="result"></pre>

  <script src="shared.js"></script>
  <script>
    (function () {
      var P = Promilia;
      var resultEl = document.getElementById("result");
      var tokenFromUrl = P.queryParam("token");
      if (tokenFromUrl) {
        document.getElementById("resetToken").value = tokenFromUrl;
      }

      P.bindCaptchaRefresh(
        document.getElementById("refreshCaptcha"),
        document.getElementById("captchaImg"),
        document.getElementById("captchaId"),
        resultEl
      );

      document.getElementById("resetForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var plainPassword = document.getElementById("newPassword").value;
        P.encryptPassword(plainPassword)
          .then(function (cipherPassword) {
            return P.api("/api/auth/reset-password", {
              method: "POST",
              body: {
                resetToken: document.getElementById("resetToken").value.trim(),
                newPassword: cipherPassword,
                captchaId: document.getElementById("captchaId").value,
                captchaCode: document.getElementById("captchaCode").value.trim(),
              },
            });
          })
          .then(function (resp) {
            P.showResult(resultEl, resp);
            P.loadCaptcha(
              document.getElementById("captchaImg"),
              document.getElementById("captchaId"),
              resultEl
            );
            document.getElementById("captchaCode").value = "";
          })
          .catch(function (err) {
            P.showResult(resultEl, { code: -1, message: String(err.message || err) });
          });
      });
    })();
  </script>
</body>
</html>
