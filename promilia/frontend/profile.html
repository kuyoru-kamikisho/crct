<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>个人信息 - 功能测试</title>
</head>
<body>
  <h1>个人信息</h1>
  <p>
    <a href="login.html">登录</a> |
    <button type="button" id="logoutBtn">清除本地 Token（登出）</button>
  </p>
  <p>当前 Token：<code id="tokenPreview"></code></p>

  <h2>1. 查询资料</h2>
  <button type="button" id="loadProfileBtn">刷新资料</button>
  <div>
    <img id="avatarPreview" alt="头像" width="80" height="80" />
  </div>
  <pre id="profileView"></pre>

  <h2>2. 更新资料</h2>
  <form id="updateForm">
    <div>
      <label>个性签名（最多 50 字） <input id="signature" type="text" maxlength="50" style="width: 24em" /></label>
    </div>
    <div>
      <label>生日 <input id="birthday" type="date" /></label>
    </div>
    <div>
      <label>
        性别
        <select id="gender">
          <option value="0">未知 (0)</option>
          <option value="1">男 (1)</option>
          <option value="2">女 (2)</option>
        </select>
      </label>
    </div>
    <div>
      <button type="submit">保存资料</button>
    </div>
  </form>

  <h2>3. 上传头像</h2>
  <form id="avatarForm">
    <div>
      <label>头像文件 <input id="avatarFile" type="file" accept="image/*" required /></label>
    </div>
    <div>
      <button type="submit">上传</button>
    </div>
  </form>

  <h2>响应</h2>
  <pre id="result"></pre>

  <script src="shared.js"></script>
  <script>
    (function () {
      var P = Promilia;
      var resultEl = document.getElementById("result");
      var profileViewEl = document.getElementById("profileView");
      var tokenPreviewEl = document.getElementById("tokenPreview");

      function refreshTokenPreview() {
        var t = P.getToken();
        tokenPreviewEl.textContent = t ? t.slice(0, 16) + "..." : "(无)";
      }

      function fillForm(data) {
        if (!data) return;
        document.getElementById("signature").value = data.signature || "";
        document.getElementById("birthday").value = data.birthday || "";
        document.getElementById("gender").value = String(
          data.gender === null || data.gender === undefined ? 0 : data.gender
        );
        var img = document.getElementById("avatarPreview");
        if (data.avatarUrl) {
          img.src = P.assetUrl(data.avatarUrl);
          img.style.display = "";
        } else {
          img.removeAttribute("src");
          img.style.display = "none";
        }
      }

      function loadProfile() {
        if (!P.getToken()) {
          P.showResult(resultEl, { code: 40100, message: "未登录：请先在登录页获取 Token" });
          return;
        }
        P.api("/api/user/profile", { auth: true }).then(function (resp) {
          P.showResult(resultEl, resp);
          if (resp.code === 0 && resp.data) {
            profileViewEl.textContent = JSON.stringify(resp.data, null, 2);
            fillForm(resp.data);
          }
        }).catch(function (err) {
          P.showResult(resultEl, { code: -1, message: String(err.message || err) });
        });
      }

      refreshTokenPreview();
      loadProfile();

      document.getElementById("loadProfileBtn").addEventListener("click", loadProfile);

      document.getElementById("logoutBtn").addEventListener("click", function () {
        P.clearToken();
        refreshTokenPreview();
        profileViewEl.textContent = "";
        P.showResult(resultEl, { message: "本地 Token 已清除" });
      });

      document.getElementById("updateForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var birthday = document.getElementById("birthday").value;
        var body = {
          signature: document.getElementById("signature").value,
          gender: Number(document.getElementById("gender").value),
        };
        if (birthday) {
          body.birthday = birthday;
        } else {
          body.birthday = null;
        }
        P.api("/api/user/profile", {
          method: "PUT",
          auth: true,
          body: body,
        }).then(function (resp) {
          P.showResult(resultEl, resp);
          if (resp.code === 0 && resp.data) {
            profileViewEl.textContent = JSON.stringify(resp.data, null, 2);
            fillForm(resp.data);
          }
        }).catch(function (err) {
          P.showResult(resultEl, { code: -1, message: String(err.message || err) });
        });
      });

      document.getElementById("avatarForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var fileInput = document.getElementById("avatarFile");
        if (!fileInput.files || !fileInput.files[0]) {
          P.showResult(resultEl, { code: -1, message: "请选择文件" });
          return;
        }
        var formData = new FormData();
        formData.append("file", fileInput.files[0]);
        P.api("/api/user/avatar", {
          method: "POST",
          auth: true,
          raw: true,
          body: formData,
        }).then(function (resp) {
          P.showResult(resultEl, resp);
          if (resp.code === 0) {
            loadProfile();
          }
        }).catch(function (err) {
          P.showResult(resultEl, { code: -1, message: String(err.message || err) });
        });
      });
    })();
  </script>
</body>
</html>
