<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>植物大战僵尸 · 原生网页版</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <!-- 移动端竖屏提示 -->
  <div id="orient-hint" class="orient-hint" hidden>
    <div class="orient-card">
      <div class="orient-phone" aria-hidden="true"></div>
      <p>请旋转设备至横屏游玩</p>
      <button type="button" id="btn-fullscreen" class="btn btn-primary">尝试全屏</button>
    </div>
  </div>

  <div id="app" class="app">
    <!-- 开始菜单 -->
    <section id="screen-menu" class="screen screen-menu active">
      <div class="menu-bg" aria-hidden="true"></div>
      <div class="menu-panel">
        <h1 class="logo">
          <span class="logo-plant">植物</span>
          <span class="logo-vs">大战</span>
          <span class="logo-zombie">僵尸</span>
        </h1>
        <p class="menu-tagline">原生 HTML · CSS · JS 轻量塔防</p>

        <div class="menu-section">
          <h2>选择关卡</h2>
          <div id="level-list" class="option-grid"></div>
        </div>

        <div class="menu-section">
          <h2>选择难度</h2>
          <div id="diff-list" class="option-row"></div>
        </div>

        <button type="button" id="btn-start" class="btn btn-start">开始游戏</button>
        <p class="menu-hint">点击阳光收集 · 拖拽植物种植 · 守住家园</p>
      </div>
    </section>

    <!-- 游戏主界面 -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="hud">
        <div class="hud-sun">
          <span class="sun-icon" aria-hidden="true"></span>
          <span id="sun-count">50</span>
        </div>
        <div class="hud-info">
          <span id="hud-level">第 1 关</span>
          <span class="hud-dot">·</span>
          <span id="hud-wave">波次 1/3</span>
          <span class="hud-dot">·</span>
          <span id="hud-diff">普通</span>
        </div>
        <div class="hud-actions">
          <button type="button" id="btn-pause" class="btn btn-ghost" title="暂停">⏸</button>
          <button type="button" id="btn-menu" class="btn btn-ghost" title="返回菜单">☰</button>
        </div>
      </header>

      <div class="seed-bar" id="seed-bar"></div>

      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage">
          <div class="lawn" id="lawn"></div>
          <div class="house" aria-hidden="true"></div>
          <div class="entities" id="entities"></div>
        </div>
      </div>

      <div id="drag-ghost" class="drag-ghost" hidden></div>
    </section>

    <!-- 暂停 -->
    <div id="overlay-pause" class="overlay" hidden>
      <div class="modal">
        <h2>游戏暂停</h2>
        <button type="button" id="btn-resume" class="btn btn-primary">继续</button>
        <button type="button" id="btn-restart-pause" class="btn btn-secondary">重新开始</button>
        <button type="button" id="btn-quit-pause" class="btn btn-ghost">返回菜单</button>
      </div>
    </div>

    <!-- 胜负 -->
    <div id="overlay-end" class="overlay" hidden>
      <div class="modal modal-end">
        <h2 id="end-title">胜利！</h2>
        <p id="end-desc" class="end-desc"></p>
        <div class="end-stats">
          <div><em id="stat-kills">0</em><span>击杀</span></div>
          <div><em id="stat-suns">0</em><span>收集阳光</span></div>
          <div><em id="stat-plants">0</em><span>种植数</span></div>
        </div>
        <button type="button" id="btn-restart" class="btn btn-primary">再来一局</button>
        <button type="button" id="btn-next" class="btn btn-secondary" hidden>下一关</button>
        <button type="button" id="btn-quit" class="btn btn-ghost">返回菜单</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
