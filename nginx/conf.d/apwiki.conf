server {
    listen 40391 ssl so_keepalive=on;
    http2 on;
    server_name apwiki.kuyoru.top;

    ssl_certificate /etc/v2ray-agent/tls/kuyoru.top.crt;
    ssl_certificate_key /etc/v2ray-agent/tls/kuyoru.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers TLS13_AES_128_GCM_SHA256:TLS13_AES_256_GCM_SHA384:TLS13_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    resolver                   1.1.1.1 valid=60s;
    resolver_timeout           2s;
    client_max_body_size 100m;

    root /usr/share/nginx/html/apwiki/;
    # index index.html;


    # =========================
    # /vote-api -> 127.0.0.1:8787
    # =========================

    location = /vote-api {
        proxy_pass http://127.0.0.1:8787/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /vote-api/ {
        proxy_pass http://127.0.0.1:8787/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # /wiki-api -> 127.0.0.1:8787
    # =========================

    location = /wiki-api {
        proxy_pass http://127.0.0.1:8787/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wiki-api/ {
        proxy_pass http://127.0.0.1:8787/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # 网站 B
    # =========================

    location / {
        try_files $uri $uri/ /index.html;
    }
}